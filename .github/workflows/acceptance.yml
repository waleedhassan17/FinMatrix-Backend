name: Acceptance

# Continuously proves the accounting core: spins up Postgres, runs migrations +
# seeds, boots the API, and runs the end-to-end acceptance suite on every push/PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  acceptance:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finmatrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      API_PREFIX: api/v1
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/finmatrix_test
      DB_SSL: 'false'
      JWT_SECRET: ci_jwt_secret_value_at_least_32_chars_long
      JWT_REFRESH_SECRET: ci_jwt_refresh_secret_at_least_32_chars_long
      COOKIE_SECRET: ci_cookie_secret_value_at_least_32_chars_long
      CORS_ORIGINS: http://localhost:3000
      EMAIL_ENABLED: 'false'
      SWAGGER_ENABLED: 'false'
      # The API throttles 100 requests/minute. That protects production from
      # abuse; in CI the only client is our own harness, and four suites in a
      # row saturate the window and fail on 429s that say nothing about the
      # ledger. Raise it here rather than pad the suites with sleeps.
      # ThrottlerGuard itself is still active and still covered by test #18.
      THROTTLE_TTL: '60'
      THROTTLE_LIMIT: '100000'
      # Credentials the acceptance suites log in with (see test/acceptance.ts).
      # WAREHOUSE-ONLY BUILD: warehouse is the tier the product ships, and the
      # only one with inventory and delivery — so it is also the tier that
      # exercises the most of the accounting engine.
      API_BASE: http://localhost:3000/api/v1
      ADMIN_EMAIL: warehouse@gmail.com
      ADMIN_PASSWORD: '123456'
      WH_EMAIL: warehouse@gmail.com
      WH_PASSWORD: '123456'
      RIDER_EMAIL: rider1@warehouseco.com
      RIDER_PASSWORD: '123456'
      RIDER2_EMAIL: rider2@warehouseco.com
      RIDER2_PASSWORD: '123456'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run migrations
        run: npm run migration:run

      # Seeds the warehouse demo company and its two riders. The chart of
      # accounts needs no separate step — CompaniesService seeds it per company
      # on creation. (The old `seed:coa` step pointed at a file that has never
      # existed in this repo, so it failed the job on every run.)
      - name: Seed the warehouse demo
        run: npm run seed:tier-demos

      - name: Build
        run: npm run build

      - name: Boot API and wait for health
        run: |
          npm run start:prod &
          npx wait-on -t 60000 http://localhost:3000/api/v1/health

      - name: Run acceptance suite
        run: npm run test:acceptance

      # The accounting gate (audit gap G5). These assert the exact debit/credit
      # lines each document produces, that every void unwinds the books, and
      # that the period lock holds for every document type.
      - name: Run accounting suite
        run: npm run test:accounting

      # Last, and non-negotiable: the twelve ledger invariants. Any query in
      # qa/invariants.sql returning a row fails the build.
      - name: Ledger invariants
        run: npm run test:qa

      # The two role matrices are the product's authorisation model -- who may
      # act directly, who must raise a request, and that a pending request
      # writes no ledger rows. `test:conformance` has existed since the staff
      # feature landed and was wired into no workflow, so 43 cases proving it
      # ran only when somebody remembered to.
      #
      # Its own database: the suite builds a schema with synchronize=true,
      # which must not touch the migration-built one the suites above use.
      # DATABASE_URL is set at job level and takes precedence over the discrete
      # DB_* vars, so it is overridden here rather than set through DB_NAME.
      - name: Role conformance (owner/staff matrices)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/finmatrix_e2e
          DB_SYNCHRONIZE: 'true'
          CREDENTIAL_ENCRYPTION_KEY: ci_credential_encryption_key_at_least_32_chars
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE finmatrix_e2e'
          npx jest --config ./test/jest-e2e.json --testPathPattern=role-conformance --runInBand

      - name: Run unit tests
        run: npm test
