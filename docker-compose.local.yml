# FinMatrix — a throwaway local stack for hands-on testing.
#
#   docker compose -f docker-compose.local.yml -p finmatrix-local up -d --build   (API on :3100, web on :5174)
#   docker compose -f docker-compose.local.yml -p finmatrix-local down -v   # discard everything
#
# Its own Postgres (own volume, own port), never the dev or production
# database. The API runs the production image the way the 1 GB Fargate task
# does: NODE_ENV=production, schema from the migrations, 768 MB heap, 1 GB cap.
# Cloudinary, email and WhatsApp are off; files are kept inside the container.
# Every secret below is a local-only dummy.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finmatrix_local
      POSTGRES_USER: finmatrix_local
      POSTGRES_PASSWORD: local-only-db-password
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finmatrix_local -d finmatrix_local']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:3100:3000'
    mem_limit: 1g
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=768
      PORT: '3000'
      API_PREFIX: api/v1
      APP_URL: http://localhost:3100
      WEB_FALLBACK_URL: http://localhost:5174
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
      DB_HOST: db
      DB_PORT: '5432'
      DB_USERNAME: finmatrix_local
      DB_PASSWORD: local-only-db-password
      DB_NAME: finmatrix_local
      DB_SSL: 'false'
      DB_SYNCHRONIZE: 'false'
      DB_MIGRATIONS_RUN: 'true'
      JWT_SECRET: fc53868861057d30c8459aa1b6ca47bfeb8aae85305be3a4
      JWT_REFRESH_SECRET: 2074544f2157d9b7f8f02b95722afbdc33dc08f6b3258ee2
      COOKIE_SECRET: 101cc7202c1b70e855b40c20c7336b1ba0648e9029219a88
      CREDENTIAL_ENCRYPTION_KEY: UVlmFSBJ0tiZo29RAddmEiz7IbpU9WxlPQY2p5M7JTs=
      EXPORT_TOKEN_SECRET: eRak3aDTe67bAHEfMxRRdYP2lVqz77r3Vc59eULPpss=
      MESSAGING_ENCRYPTION_KEY: 67eC4Mf+VQ0B2YjodGwCE8XPyVBb+sMrVom2eyY6btc=
      BCRYPT_ROUNDS: '10'
      THROTTLE_LIMIT: '1000'
      # Many test logins come from this one machine.
      SIGNIN_IP_LIMIT: '1000'
      SIGNIN_ACCOUNT_LIMIT: '100'
      EMAIL_ENABLED: 'false'
      WHATSAPP_ENABLED: 'false'
      MESSAGING_WORKER_ENABLED: 'false'
      DAY_SUMMARY_WORKER_ENABLED: 'false'
      EXPORT_WORKER_ENABLED: 'true'
      MIGRATION_READ_WORKER_ENABLED: 'true'
      MIGRATION_AI_ENABLED: 'false'
      CLOUDINARY_CLOUD_NAME: ''
      CLOUDINARY_API_KEY: ''
      CLOUDINARY_API_SECRET: ''
      CLOUDINARY_URL: ''
      SENTRY_DSN: ''
      SWAGGER_ENABLED: 'true'
      LOG_LEVEL: info

volumes:
  pgdata:
